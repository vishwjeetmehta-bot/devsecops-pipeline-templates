repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # ── General File Hygiene ──────────────────────────────────
      - id: trailing-whitespace
        name: "Trim Trailing Whitespace"
      - id: end-of-file-fixer
        name: "Fix End of File"
      - id: check-yaml
        name: "Validate YAML Syntax"
        args: [--allow-multiple-documents]
      - id: check-json
        name: "Validate JSON Syntax"
      - id: check-merge-conflict
        name: "Block Merge Conflict Markers"
      - id: check-added-large-files
        name: "Block Large File Commits"
        args: [--maxkb=1000]
      - id: detect-private-key
        name: "Block Private Key Files"
      - id: no-commit-to-branch
        name: "Protect Main Branch"
        args: [--branch, main, --branch, master]

  # ── Secret Detection (GitLeaks) ────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "🔍 GitLeaks: Secret Detection"

  # ── Terraform IaC Security ─────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        name: "✅ Terraform: Format Check"
      - id: terraform_validate
        name: "✅ Terraform: Validate"
      - id: terraform_tflint
        name: "✅ Terraform: TFLint"
        args:
          - "--args=--only=terraform_deprecated_interpolation"
          - "--args=--only=terraform_deprecated_index"
          - "--args=--only=terraform_unused_declarations"
          - "--args=--only=terraform_comment_syntax"
          - "--args=--only=terraform_documented_outputs"
          - "--args=--only=terraform_documented_variables"
          - "--args=--only=terraform_typed_variables"
          - "--args=--only=terraform_module_pinned_source"
          - "--args=--only=terraform_naming_convention"
          - "--args=--minimum-failure-severity=warning"
      - id: terraform_checkov
        name: "🔒 Checkov: IaC Policy Scan"
        args:
          - --args=--framework terraform
          - --args=--check CKV_AZURE_*
          - --args=--compact
          - --args=--quiet
      - id: terraform_docs
        name: "📚 Terraform: Generate Docs"
        args:
          - --args=--output-file README.md
          - --args=--output-mode inject

  # ── Docker / Container Security ────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        name: "🐳 Hadolint: Dockerfile Lint"
        args:
          - --failure-threshold=error
          - --ignore=DL3008
          - --ignore=DL3013

  # ── Python Code Quality ────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        name: "🐍 Ruff: Python Linter"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: "🐍 Ruff: Python Formatter"

  # ── Shell Script Quality ───────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "🐚 ShellCheck: Bash Lint"
        args: [--severity=warning]

  # ── YAML / Markdown Hygiene ────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: "📄 YAML Lint"
        args:
          - -d
          - |
            extends: default
            rules:
              line-length:
                max: 150
              truthy:
                allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: "📝 Markdown Lint"
        args:
          - --disable=MD013  # Line length (disabled for README tables)
          - --disable=MD033  # HTML in markdown (disabled for badges)
