name: "🐳 Container DevSecOps Pipeline"

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "src/**"
      - ".github/workflows/container-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "src/**"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  packages: write

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # GATE 1: Secret Detection
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: "🔍 Secret Detection (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # GATE 2: Code Quality (SonarQube SAST)
  # ─────────────────────────────────────────────────────────────
  code-quality:
    name: "🔬 Code Quality & SAST (SonarQube)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube blame

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_id }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  # ─────────────────────────────────────────────────────────────
  # GATE 3: Build Docker Image (No push yet — just build and cache)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: "🏗️ Docker Build"
    runs-on: ubuntu-latest
    needs: [secret-scan, code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Cache Only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # GATE 4: Container Vulnerability Scan (Trivy)
  # ─────────────────────────────────────────────────────────────
  trivy-scan:
    name: "🔍 Container Vulnerability Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker Image
        run: docker load --input /tmp/image.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-container"

      - name: Run Trivy Dockerfile Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-dockerfile-results.sarif"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Upload Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-dockerfile-results.sarif
          category: "trivy-dockerfile"

  # ─────────────────────────────────────────────────────────────
  # GATE 5: Push to Azure Container Registry (Main only)
  # ─────────────────────────────────────────────────────────────
  push-to-acr:
    name: "📦 Push to Azure Container Registry"
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Clean Image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            security.trivy.scan=passed
            security.checkov.scan=passed

      - name: Sign Container Image (Cosign)
        uses: sigstore/cosign-installer@v3
        
      - name: Sign the Published Image
        run: |
          cosign sign --yes \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: 1
